<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isaiify - Online Tamil Music App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-card: #1e1e1e;
            --accent: #ff334b;
            --accent-hover: #ff4d61;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 0;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            background: var(--bg-secondary);
            display: grid;
            grid-template-rows: auto 1fr 78px;
            grid-template-areas: 
                "header"
                "main"
                "player";
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        @media (min-width: 768px) {
            body {
                padding: 12px;
            }
            .app-container {
                max-width: 1100px;
                height: 85vh;
                max-height: 750px;
                border-radius: 20px;
                overflow: hidden;
                grid-template-columns: 220px 1fr;
                grid-template-rows: 1fr 85px;
                grid-template-areas: 
                    "sidebar main"
                    "player player";
            }
            .sidebar {
                display: flex !important;
            }
            .mobile-header {
                display: none !important;
            }
        }

        /* SIDEBAR (Desktop) */
        .sidebar {
            display: none;
            grid-area: sidebar;
            background: #000000;
            padding: 20px 15px;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--border);
        }

        .logo-area {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding-left: 5px;
        }

        .logo-area i {
            color: var(--accent);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-links li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-links li.active a, .nav-links li a:hover {
            color: var(--text-main);
            background: var(--bg-card);
        }

        /* MOBILE HEADER */
        .mobile-header {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #000000;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: 700;
        }

        .mobile-header span {
            color: var(--accent);
        }

        .mobile-header i {
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 15px;
        }

        /* MAIN CONTENT */
        .main-content {
            grid-area: main;
            overflow-y: auto;
            padding: 16px;
            position: relative;
        }

        .view-section {
            display: none;
            height: 100%;
        }

        .view-section.active {
            display: block;
        }

        /* LOGIN VIEW */
        #login-view.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        .login-box {
            background: var(--bg-card);
            padding: 30px 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--border);
        }

        .login-box h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .login-box p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        /* BANNER & SEARCH */
        .banner {
            background: linear-gradient(135deg, #ff334b, #ff7525);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .banner h1 {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .banner p {
            font-size: 11px;
            opacity: 0.9;
        }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-container input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* CARD GRID */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 20px;
        }

        @media(min-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 16px;
            }
        }

        .music-card {
            background: var(--bg-card);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .music-card:active {
            transform: scale(0.97);
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .music-card h4 {
            font-size: 13px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card p {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* NOW PLAYING VIEW */
        #player-ui-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        .player-artwork-large {
            width: 190px;
            height: 190px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            margin-bottom: 16px;
        }

        .playing-info h2 {
            font-size: 18px;
            margin-bottom: 4px;
            max-width: 280px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playing-info p {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* BOTTOM PLAYER */
        .bottom-player {
            grid-area: player;
            background: #0d0d0d;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            height: 78px;
        }

        .track-details {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 40%;
            cursor: pointer;
        }

        .track-details img {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            object-fit: cover;
        }

        .track-meta h4 {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .track-meta p {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .player-controls-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 50%;
        }

        .control-icons {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .control-icons .main-play {
            font-size: 13px;
            background: var(--text-main);
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .playback-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            font-size: 9px;
            color: var(--text-muted);
        }

        .progress-line {
            flex: 1;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--text-main);
            border-radius: 2px;
        }

        .player-extras {
            display: none;
        }

        @media(min-width: 768px) {
            .player-extras {
                display: flex;
                align-items: center;
                gap: 10px;
                color: var(--text-muted);
                width: 15%;
            }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 12px;
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <audio id="audio-element"></audio>

    <div class="app-container">
        
        <!-- MOBILE HEADER -->
        <div class="mobile-header">
            <div><i class="fa-solid fa-compact-disc" style="color:var(--accent);"></i> Isaiify</div>
            <div>
                <i class="fa-solid fa-house" onclick="switchView('discover-view')"></i>
                <i class="fa-solid fa-radio" onclick="switchView('player-ui-view')"></i>
                <i class="fa-solid fa-right-from-bracket" onclick="handleLogout()"></i>
            </div>
        </div>

        <!-- SIDEBAR (Desktop) -->
        <div class="sidebar">
            <div>
                <div class="logo-area">
                    <i class="fa-solid fa-compact-disc"></i> Isaiify
                </div>
                <ul class="nav-links">
                    <li class="active" onclick="switchView('discover-view', this)"><a><i class="fa-solid fa-house"></i> Home</a></li>
                    <li onclick="switchView('player-ui-view', this)"><a><i class="fa-solid fa-radio"></i> Now Playing</a></li>
                </ul>
            </div>
            <div>
                <ul class="nav-links">
                    <li onclick="handleLogout()"><a><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
                </ul>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">

            <!-- LOGIN VIEW -->
            <div id="login-view" class="view-section">
                <div class="login-box">
                    <h2>Welcome to Isaiify</h2>
                    <p>Enter your name to start listening</p>
                    <form onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <label>Your Name</label>
                            <input type="text" id="username-input" placeholder="e.g. Joshua" required>
                        </div>
                        <button type="submit" class="btn-primary">Get Started</button>
                    </form>
                </div>
            </div>

            <!-- DISCOVER & SEARCH VIEW -->
            <div id="discover-view" class="view-section">
                <div class="banner">
                    <div>
                        <h1 id="welcome-banner-title">Vanakkam!</h1>
                        <p>Search any song online via Apple Music server.</p>
                    </div>
                </div>

                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search Tamil songs, Anirudh, Vijay..." oninput="searchOnlineMusic(this.value)">
                </div>

                <div class="section-title">Live Online Search Results</div>
                <div id="track-grid" class="card-grid">
                    <div class="loading-text">Type above to search live online songs...</div>
                </div>
            </div>

            <!-- NOW PLAYING VIEW -->
            <div id="player-ui-view" class="view-section">
                <img id="large-artwork" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500" alt="Artwork" class="player-artwork-large">
                <div class="playing-info">
                    <h2 id="large-title">Select a Track</h2>
                    <p id="large-artist">Artist Name</p>
                </div>
            </div>

        </div>

        <!-- BOTTOM PLAYER -->
        <div class="bottom-player">
            <div class="track-details" onclick="switchView('player-ui-view')">
                <img id="mini-artwork" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100" alt="Mini">
                <div class="track-meta">
                    <h4 id="mini-title">No track selected</h4>
                    <p id="mini-artist">-</p>
                </div>
            </div>

            <div class="player-controls-center">
                <div class="control-icons">
                    <i class="fa-solid fa-shuffle"></i>
                    <i class="fa-solid fa-backward-step" onclick="playPrevTrack()"></i>
                    <div class="main-play" id="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></div>
                    <i class="fa-solid fa-forward-step" onclick="playNextTrack()"></i>
                    <i class="fa-solid fa-repeat"></i>
                </div>
                <div class="playback-bar">
                    <span id="current-time">0:00</span>
                    <div class="progress-line" id="progress-container" onclick="seekAudio(event)"><div class="progress-fill" id="progress-fill"></div></div>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="player-extras">
                <i class="fa-solid fa-volume-high"></i>
                <div class="progress-line" style="width: 70px;"><div class="progress-fill" style="width: 70%;"></div></div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT ONLINE API LOGIC -->
    <script>
        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const trackGrid = document.getElementById('track-grid');
        
        let currentPlaylist = [];
        let currentIndex = 0;
        let currentTrackData = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('isaiify_username');
            if (savedName) {
                document.getElementById('welcome-banner-title').innerText = `Vanakkam, ${savedName}!`;
                switchView('discover-view', null);
                searchOnlineMusic('Tamil Hits'); // Initial automatic search load
            } else {
                switchView('login-view', null);
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const name = document.getElementById('username-input').value.trim();
            if (name) {
                localStorage.setItem('isaiify_username', name);
                document.getElementById('welcome-banner-title').innerText = `Vanakkam, ${name}!`;
                switchView('discover-view', null);
                searchOnlineMusic('Tamil Hits');
            }
        }

        function handleLogout() {
            localStorage.removeItem('isaiify_username');
            audioElement.pause();
            switchView('login-view', null);
        }

        let searchTimer;
        function searchOnlineMusic(query) {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(async () => {
                const searchQuery = query.trim() || 'Tamil Hits';
                trackGrid.innerHTML = `<div class="loading-text">Searching Apple Music server for "${searchQuery}"...</div>`;
                
                try {
                    const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchQuery)}&media=music&entity=song&limit=20`);
                    const data = await response.json();
                    
                    if (data && data.results && data.results.length > 0) {
                        currentPlaylist = data.results;
                        displayOnlineTracks(currentPlaylist);
                    } else {
                        trackGrid.innerHTML = `<div class="loading-text">No songs found. Try another name!</div>`;
                    }
                } catch (error) {
                    console.error('API Error:', error);
                    trackGrid.innerHTML = `<div class="loading-text">Network error. Please check your internet connection.</div>`;
                }
            }, 500);
        }

        function displayOnlineTracks(tracks) {
            trackGrid.innerHTML = '';
            tracks.forEach((track, index) => {
                const artworkUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '300x300bb') : 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300';
                
                const card = document.createElement('div');
                card.className = 'music-card';
                card.innerHTML = `
                    <img src="${artworkUrl}" alt="${track.trackName}">
                    <h4>${track.trackName}</h4>
                    <p>${track.artistName}</p>
                `;
                
                card.onclick = () => {
                    currentIndex = index;
                    playTrackByIndex(currentIndex);
                };
                trackGrid.appendChild(card);
            });
        }

        function playTrackByIndex(index) {
            if (index < 0 || index >= currentPlaylist.length) return;
            currentIndex = index;
            const track = currentPlaylist[currentIndex];

            const artworkUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '300x300bb') : 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300';
            const audioStreamUrl = track.previewUrl; // Live online preview link

            currentTrackData = {
                name: track.trackName,
                artist: track.artistName,
                image: artworkUrl,
                audio: audioStreamUrl
            };

            audioElement.src = audioStreamUrl;
            audioElement.load();
            audioElement.play().catch(e => {
                console.warn("Autoplay restricted. Tap play button.");
            });

            document.getElementById('mini-title').innerText = track.trackName;
            document.getElementById('mini-artist').innerText = track.artistName;
            document.getElementById('mini-artwork').src = artworkUrl;

            document.getElementById('large-title').innerText = track.trackName;
            document.getElementById('large-artist').innerText = `${track.artistName} • Isaiify`;
            document.getElementById('large-artwork').src = artworkUrl;

            playIcon.className = "fa-solid fa-pause";
        }

        function playNextTrack() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playTrackByIndex(currentIndex);
        }

        function playPrevTrack() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrackByIndex(currentIndex);
        }

        audioElement.onended = () => {
            playNextTrack();
        };

        function togglePlay() {
            if (!currentTrackData) return;
            if (audioElement.paused) {
                audioElement.play();
                playIcon.className = "fa-solid fa-pause";
            } else {
                audioElement.pause();
                playIcon.className = "fa-solid fa-play";
            }
        }

        audioElement.ontimeupdate = () => {
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                document.getElementById('progress-fill').style.width = `${progressPercent}%`;

                document.getElementById('current-time').innerText = formatTime(audioElement.currentTime);
                document.getElementById('duration').innerText = formatTime(audioElement.duration);
            }
        };

        function seekAudio(event) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const clickPosition = (event.clientX - rect.left) / container.offsetWidth;
            if (audioElement.duration) {
                audioElement.currentTime = clickPosition * audioElement.duration;
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function switchView(viewId, element) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if (element) {
                document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
                element.classList.add('active');
            }
        }
    </script>
</body>
</html>
